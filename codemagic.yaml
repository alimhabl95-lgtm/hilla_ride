# Hello Tuk-Tuk — Native Swift iOS (TestFlight)
#
# IMPORTANT: In Codemagic app settings → Build configuration → select
# "codemagic.yaml" (not the Workflow Editor / Default Workflow).
#
# After pushing this file, start a build and choose workflow:
#   "Hello Tuk-Tuk Native iOS"

workflows:
  hello-tuk-tuk-native-ios:
    name: Hello Tuk-Tuk Native iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hillaride.hillaRide
      vars:
        MARKETING_VERSION: "2.0.0"
        BUILD_NUMBER: "61"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Verify native Swift project
        script: |
          set -euo pipefail
          echo "=========================================="
          echo " NATIVE SWIFT BUILD (NOT Flutter)"
          echo " Version: ${MARKETING_VERSION} (${BUILD_NUMBER})"
          echo " Project: hilla_ride_ios/HelloTukTuk.xcodeproj"
          echo "=========================================="
          test -f hilla_ride_ios/HelloTukTuk.xcodeproj/project.pbxproj
          test -f hilla_ride_ios/HelloTukTuk/HelloTukTukApp.swift
          grep -q 'MARKETING_VERSION = 2.0.0' hilla_ride_ios/HelloTukTuk.xcodeproj/project.pbxproj
      - name: Set up code signing
        script: |
          set -euo pipefail
          cd hilla_ride_ios
          xcode-project use-profiles
      - name: Build Release IPA (Swift)
        script: |
          set -euo pipefail
          cd hilla_ride_ios
          xcodebuild -resolvePackageDependencies -project HelloTukTuk.xcodeproj -scheme HelloTukTuk
          xcodebuild -project HelloTukTuk.xcodeproj \
            -scheme HelloTukTuk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HelloTukTuk.xcarchive \
            archive \
            DEVELOPMENT_TEAM=XAZ6V7UTYT \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          xcodebuild -exportArchive \
            -archivePath build/HelloTukTuk.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist
          IPA="$(ls build/ipa/*.ipa | head -1)"
          echo "Built IPA: $IPA"
          TMP="$(mktemp -d)"
          unzip -q "$IPA" -d "$TMP"
          PLIST="$TMP/Payload/HelloTukTuk.app/Info.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST="$(find "$TMP/Payload" -name Info.plist | head -1)"
          fi
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          DISPLAY="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          echo "Bundle version: $VERSION ($BUILD)"
          echo "Display name: $DISPLAY"
          rm -rf "$TMP"
          echo "Native Swift IPA ready for TestFlight"
    artifacts:
      - hilla_ride_ios/build/ipa/*.ipa
      - hilla_ride_ios/build/HelloTukTuk.xcarchive/**/*
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

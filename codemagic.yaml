workflows:
  ios-release:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hillaride.hillaRide
      vars:
        APP_STORE_APPLE_ID: "YOUR_APPLE_ID_EMAIL"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        BUILD_NAME: "1.0.59"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Prepare Flutter release engine
        script: |
          flutter --version
          flutter precache --ios --force
          flutter doctor -v
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build and verify release IPA
        script: |
          bash ios/build_release_ipa.sh
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

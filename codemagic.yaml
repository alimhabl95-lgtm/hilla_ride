workflows:
  ios-release:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hillaride.hillaRide
      vars:
        APP_STORE_APPLE_ID: "YOUR_APPLE_ID_EMAIL"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Upgrade Flutter SDK
        script: |
          flutter --version
          flutter channel stable
          flutter upgrade
          flutter precache --ios
          flutter --version
      - name: Prepare release iOS project
        script: |
          flutter clean
          rm -rf ios/build ios/.symlinks ios/Flutter/ephemeral
          flutter pub get
          flutter build ios --config-only --release
          echo "Generated iOS config:"
          cat ios/Flutter/Generated.xcconfig
          if grep -q "FLUTTER_BUILD_MODE=debug" ios/Flutter/Generated.xcconfig; then
            echo "ERROR: iOS project is debug mode"
            exit 1
          fi
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod repo update
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build and verify release IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/exportOptions.plist \
            --build-name=1.0.56 \
            --build-number=$PROJECT_BUILD_NUMBER
          BUILD_MODE=$(grep FLUTTER_BUILD_MODE ios/Flutter/Generated.xcconfig | cut -d= -f2)
          if [ "$BUILD_MODE" != "release" ]; then
            echo "ERROR: Expected release IPA, got FLUTTER_BUILD_MODE=$BUILD_MODE"
            exit 1
          fi
          bash ios/verify_release_ipa.sh
          echo "SUCCESS: Release IPA ready for TestFlight upload"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

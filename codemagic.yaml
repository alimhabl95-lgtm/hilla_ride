workflows:
  ios-release:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hillaride.hillaRide
      vars:
        APP_STORE_APPLE_ID: "YOUR_APPLE_ID_EMAIL"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Prepare Flutter release engine
        script: |
          flutter --version
          flutter precache --ios --force
          flutter doctor -v
      - name: Prepare iOS dependencies
        script: |
          flutter clean
          rm -rf build ios/build ios/.symlinks ios/Flutter/ephemeral ios/Flutter/Flutter.framework
          flutter pub get
          flutter build ios --release --config-only \
            --build-name=1.0.58 \
            --build-number=$PROJECT_BUILD_NUMBER
          echo "Generated iOS config before pod install:"
          cat ios/Flutter/Generated.xcconfig
          BUILD_MODE=$(grep FLUTTER_BUILD_MODE ios/Flutter/Generated.xcconfig | cut -d= -f2)
          if [ "$BUILD_MODE" != "release" ]; then
            echo "ERROR: Expected release config before pod install, got FLUTTER_BUILD_MODE=$BUILD_MODE"
            exit 1
          fi
          cd ios
          pod repo update
          pod install
          cd ..
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build and verify release IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/exportOptions.plist \
            --build-name=1.0.58 \
            --build-number=$PROJECT_BUILD_NUMBER
          echo "Generated iOS config after IPA build:"
          cat ios/Flutter/Generated.xcconfig
          BUILD_MODE=$(grep FLUTTER_BUILD_MODE ios/Flutter/Generated.xcconfig | cut -d= -f2)
          if [ "$BUILD_MODE" != "release" ]; then
            echo "ERROR: Expected release IPA, got FLUTTER_BUILD_MODE=$BUILD_MODE"
            exit 1
          fi
          bash ios/verify_release_ipa.sh
          echo "SUCCESS: Verified release IPA for TestFlight"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

# Hello Tuk-Tuk — Native Swift iOS (TestFlight)
#
# Signing: App Store Connect integration creates/fetches cert + profile during the build.
# No manual .p12 upload required if the integration "codemagic" is connected.
#
# After the first successful build, copy CERTIFICATE_PRIVATE_KEY from the build log into
# Codemagic → Application → Environment variables (secure) so future builds reuse the same cert.

workflows:
  hello-tuk-tuk-native-ios:
    name: Hello Tuk-Tuk Native iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        BUNDLE_ID: com.hillaride.hillaRide
        XCODE_PROJECT: hilla_ride_ios/HelloTukTuk.xcodeproj
        XCODE_SCHEME: HelloTukTuk
        MARKETING_VERSION: "2.0.0"
        BUILD_NUMBER: "61"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Verify native Swift project
        script: |
          set -euo pipefail
          echo "=========================================="
          echo " NATIVE SWIFT BUILD (NOT Flutter)"
          echo " Version: ${MARKETING_VERSION} (${BUILD_NUMBER})"
          echo " Bundle ID: ${BUNDLE_ID}"
          echo " Project: ${XCODE_PROJECT}"
          echo "=========================================="
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/hilla_ride_ios/HelloTukTuk/HelloTukTukApp.swift"
      - name: Prepare distribution certificate private key
        script: |
          set -euo pipefail
          KEY_FILE="/tmp/ios_distribution_key.pem"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Using stored CERTIFICATE_PRIVATE_KEY from Codemagic environment"
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_FILE"
          else
            echo "Generating a new distribution certificate private key for this build"
            openssl genrsa -out "$KEY_FILE" 2048
            echo ""
            echo "============================================================"
            echo " SAVE THIS KEY IN CODEMAGIC (one time, after build succeeds):"
            echo " Application → Environment variables → CERTIFICATE_PRIVATE_KEY"
            echo " Mark as Secure. Paste the full PEM below on future builds."
            echo "============================================================"
            cat "$KEY_FILE"
            echo "============================================================"
          fi
      - name: Fetch signing files from Apple
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/ios_distribution_key.pem
      - name: Set up keychain
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates
      - name: Apply signing to native Xcode project only
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --code-signing-setup-verbose-logging
      - name: Build Release IPA (Swift)
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="DEVELOPMENT_TEAM=XAZ6V7UTYT MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          IPA="$(ls "$CM_BUILD_DIR"/build/ios/ipa/*.ipa | head -1)"
          echo "Built IPA: $IPA"
          TMP="$(mktemp -d)"
          unzip -q "$IPA" -d "$TMP"
          PLIST="$(find "$TMP/Payload" -name Info.plist | head -1)"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          DISPLAY="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          echo "Bundle version: $VERSION ($BUILD)"
          echo "Display name: $DISPLAY"
          rm -rf "$TMP"
          echo "Native Swift IPA ready for TestFlight"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

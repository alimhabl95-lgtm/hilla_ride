# Hello Tuk-Tuk — Native Swift iOS (TestFlight)
#
# Signing: Team distribution cert + fresh App Store profile created via App Store Connect API.

workflows:
  hello-tuk-tuk-native-ios:
    name: Hello Tuk-Tuk Native iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hillaride.hillaRide
        certificates:
          - hilla_ride_distribution
      vars:
        BUNDLE_ID: com.hillaride.hillaRide
        XCODE_PROJECT: hilla_ride_ios/HelloTukTuk.xcodeproj
        XCODE_SCHEME: HelloTukTuk
        MARKETING_VERSION: "2.1.0"
        BUILD_NUMBER: "64"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Verify native Swift project
        script: |
          set -euo pipefail
          echo "=========================================="
          echo " NATIVE SWIFT BUILD (NOT Flutter)"
          echo " Version: ${MARKETING_VERSION} (${BUILD_NUMBER})"
          echo " Bundle ID: ${BUNDLE_ID}"
          echo " Project: ${XCODE_PROJECT}"
          echo "=========================================="
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/hilla_ride_ios/HelloTukTuk/HelloTukTukApp.swift"
      - name: Set up keychain
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates
          echo "Code signing identities in keychain:"
          security find-identity -v -p codesigning || true
      - name: Apply signing to native Xcode project only
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --code-signing-setup-verbose-logging
          echo "Signing settings applied to project:"
          grep -E "CODE_SIGN|PROVISIONING" "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj" | head -20 || true
      - name: Build Release IPA (Swift)
        script: |
          set -euo pipefail
          LOG_DIR="/tmp/hilla_ride_ios_build"
          mkdir -p "$LOG_DIR"

          xcodebuild -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            2>&1 | tee "$LOG_DIR/resolve_packages.log"

          echo "========== Archive + export IPA =========="
          set +e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'" \
            --archive-xcargs "DEVELOPMENT_TEAM=XAZ6V7UTYT MARKETING_VERSION=${MARKETING_VERSION} CURRENT_PROJECT_VERSION=${BUILD_NUMBER} CODE_SIGN_STYLE=Manual COMPILER_INDEX_STORE_ENABLE=NO" \
            2>&1 | tee "$LOG_DIR/archive_export.log"
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ARCHIVE_STATUS" -ne 0 ]; then
            echo "========== ARCHIVE / EXPORT ERRORS =========="
            grep -iE '(error:|fatal error:|ARCHIVE FAILED|EXPORT FAILED|BUILD FAILED|Unable to find a destination|provisioning profile|Signing for|command failed|❌|The following build commands failed|\.swift:[0-9]+:[0-9]+:)' \
              "$LOG_DIR/archive_export.log" "$LOG_DIR/resolve_packages.log" || true
            if [ -d /tmp/xcodebuild_logs ]; then
              echo "----- xcodebuild log files -----"
              find /tmp/xcodebuild_logs -type f -name '*.log' -print
              find /tmp/xcodebuild_logs -type f -name '*.log' -exec grep -iE '(error:|fatal error:|Signing for|provisioning profile)' {} + || true
            fi
            tail -n 200 "$LOG_DIR/archive_export.log"
            echo "============================================="
            exit "$ARCHIVE_STATUS"
          fi

          IPA="$(ls "$CM_BUILD_DIR"/build/ios/ipa/*.ipa | head -1)"
          echo "Built IPA: $IPA"
          TMP="$(mktemp -d)"
          unzip -q "$IPA" -d "$TMP"
          PLIST="$(find "$TMP/Payload" -name Info.plist | head -1)"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          DISPLAY="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")"
          echo "Bundle version: $VERSION ($BUILD)"
          echo "Display name: $DISPLAY"
          rm -rf "$TMP"
          echo "Native Swift IPA ready for TestFlight"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/hilla_ride_ios_build/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
